<nav class="topbar">

    <div class="topbar-left">
        {% if show_back %}
            <a href="javascript:history.back()" class="back-btn">
                ←
            </a>
        {% endif %}
    </div>

    <div class="topbar-center" id="saludo-navbar">
        {% set hora = moment().hour if moment else 12 %}

        {% if hora < 12 %}
            Buenos días,
        {% elif hora < 19 %}
            Buenas tardes,
        {% else %}
            Buenas noches,
        {% endif %}

        {{ session.get('nombre', 'Usuario') }}
    </div>

    <div class="topbar-right">
        <a href="{{ url_for('logout') }}" class="logout-btn">
            Cerrar sesión
        </a>
    </div>

    <script>
const hora = new Date().getHours();
let saludo = "Buenas tardes";

if (hora < 12) saludo = "Buenos días";
else if (hora >= 19) saludo = "Buenas noches";

document.getElementById("saludo-navbar").textContent =
    `${saludo}, {{ session.get('nombre', 'Usuario') }}`;
</script>

</nav>
